<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    The favicon variant of the mark in public/icon.svg. Full-bleed rather than
    framed: at 16px the outer dark border of the PWA icon costs a pixel on every
    side and the gradient it wraps ends up too small to read as a gradient.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g)" />
  <path
    d="M118 172h276M256 172v186"
    stroke="#07070c"
    stroke-width="62"
    stroke-linecap="round"
  />
</svg>
