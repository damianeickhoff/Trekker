<!doctype html>
<!--
  The screen between tapping the icon and the app answering.

  Served by the service worker whenever a navigation cannot reach the server —
  which on this deployment is not an edge case: the container runs `migrate
  deploy` before the server binds, so every update leaves a window of several
  seconds where the app is installed, the icon works, and nothing is listening.
  What used to happen then was a blank screen and then the browser's own error
  page. This is what happens instead.

  It is one file with two states rather than two documents. "Still coming" and
  "not coming" are the same wait at different lengths, and the second is only
  known by having done the first — so the page starts hopeful, keeps asking,
  and settles into the offline copy once asking has stopped being reasonable.

  Deliberately static, self-contained and framework-free: it is needed exactly
  when the thing that would render it is not there. No build step, no fonts to
  fetch, no stylesheet to miss. The background matches `background_color` in the
  manifest so the hand-off from the OS launch screen has nothing to flash.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07070c" />
    <title>Trekker</title>
    <style>
      :root {
        --ink: #07070c;
        --ink-400: #9ca3af;
        --ink-100: #f3f4f6;
        --violet: #8b5cf6;
        --amber: #f59e0b;
      }

      * { box-sizing: border-box; }

      html, body {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--ink);
        color: var(--ink-100);
        /* The system stack: a webfont is a network request, and this page only
           exists because the network is the thing that failed. */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: grid;
        place-items: center;
        padding: 2rem calc(1.5rem + env(safe-area-inset-right)) calc(2rem + env(safe-area-inset-bottom))
          calc(1.5rem + env(safe-area-inset-left));
        text-align: center;
      }

      /* The same mark the home screen icon uses, so the icon appears to open
         into the app rather than being replaced by something else. */
      .mark {
        width: 84px;
        height: 84px;
        border-radius: 24px;
        background: var(--violet);
        display: grid;
        place-items: center;
        margin: 0 auto;
        box-shadow: 0 24px 60px -24px rgb(139 92 246 / 0.7);
      }

      /* Sized by height — the mark is taller than it is wide, and setting both
         squashes it. */
      .mark svg { width: 42px; height: 52px; display: block; }

      h1 {
        margin: 1.5rem 0 0;
        font-size: 1.0625rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0.5rem auto 0;
        max-width: 22rem;
        font-size: 0.875rem;
        line-height: 1.55;
        color: var(--ink-400);
      }

      /* An indeterminate sliver rather than a spinner: there is no progress to
         report, and a bar that pretends otherwise is a lie told slowly. */
      .track {
        width: 132px;
        height: 3px;
        margin: 1.75rem auto 0;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.08);
        overflow: hidden;
      }

      .track i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--violet), var(--amber));
        animation: slide 1.4s ease-in-out infinite;
      }

      @keyframes slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(360%); }
      }

      button {
        margin-top: 1.75rem;
        border: 0;
        border-radius: 12px;
        background: var(--violet);
        color: #fff;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0.7rem 1.15rem;
        cursor: pointer;
        transition: background-color 0.15s ease, transform 0.15s ease;
      }

      button:active { transform: scale(0.98); }

      /* The two states. Only one is ever in the document's flow. */
      [hidden] { display: none !important; }

      .fade { animation: fade 0.4s ease both; }

      @keyframes fade {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        .track i { animation: none; width: 100%; opacity: 0.5; }
        .fade { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">
        <!-- A copy of `MARK_GEOMETRY` in `src/lib/logo.ts`. This page is served
             flat and inlines everything it needs on purpose — it only exists
             because the network is the thing that failed — so it cannot import
             it. Change it there and change it here. -->
        <svg viewBox="0 0 533 658" fill="#fff">
          <path d="M163.763 344H163.785L187.785 636H166.535C154.395 636 144.155 626.96 142.65 614.914L108.848 344.5H50.836C43.2794 344.5 36.9022 338.879 35.9542 331.382L27.419 263.882C26.2862 254.922 33.2699 247 42.3009 247H156.785L163.763 344Z"/>
          <path d="M375.318 344H375.298L350.785 636H372.035C384.175 636 394.415 626.96 395.92 614.914L429.722 344.5H487.734C495.291 344.5 501.668 338.879 502.616 331.382L511.151 263.882C512.284 254.922 505.3 247 496.269 247H381.785L375.318 344Z"/>
          <path d="M213.785 246H323.785L306.785 635.5H230.285L213.785 246Z"/>
          <circle cx="446.785" cy="70" r="22"/>
          <ellipse cx="445.785" cy="36.5" rx="26" ry="25.5"/>
          <ellipse cx="477.285" cy="59" rx="24.5" ry="25"/>
          <path d="M135.696 121.285C82.4962 110.476 70.5295 148.14 71.1962 168.324L83.2986 233H251.299C250.965 219.322 248.496 190.041 241.696 178.832C234.896 167.623 210.196 149.475 198.696 141.802C227.196 88.7577 142.196 74.2454 135.696 121.285Z"/>
          <path d="M70.7241 168.261C15.3036 165.802 19.3305 226.303 36.2606 232.919C36.7828 233.124 37.3414 233.187 37.9021 233.185L96.2986 233C121.222 187.851 89.4839 171.091 70.7241 168.261Z"/>
          <path d="M339.696 82.2598C315.696 -13.239 178.196 53.2609 235.696 129.759L323.196 183.761L339.696 82.2598Z"/>
          <path d="M76.2986 233C83.2986 212.667 105.796 178.162 140.196 203.762C144.863 189.929 162.396 166.462 195.196 183.262C191.196 153.762 231.196 97.2625 287.696 152.762C278.933 59.2868 434.186 52.0871 409.129 156.086C421.848 130.662 478.056 132.417 476.696 177.761C497.297 177.761 523.192 209.038 496.317 231.94C495.298 232.808 493.969 233.26 492.632 233.26L76.2986 233Z"/>
        </svg>
      </span>

      <!-- Waiting. -->
      <div id="waiting">
        <h1>Trekker</h1>
        <p id="waiting-copy">Starting up…</p>
        <div class="track" role="progressbar" aria-label="Starting up"><i></i></div>
      </div>

      <!-- Given up. The wording is the offline page's, which this replaces. -->
      <div id="offline" hidden class="fade">
        <h1>No connection</h1>
        <p>
          Trekker keeps everything on your own server, so it needs to reach it to
          show you anything. Nothing has been lost — this page will work again
          the moment you are back.
        </p>
        <button type="button" id="retry">Try again</button>
      </div>
    </main>

    <script>
      (function () {
        "use strict";

        // Roughly twelve seconds of asking before this stops being "starting up"
        // and starts being "not there". Long enough to cover a container that is
        // applying migrations before it binds, short enough that a genuinely
        // offline phone is not left watching a bar for a minute.
        var INTERVAL_MS = 1200;
        var ATTEMPTS = 10;

        var tries = 0;
        var waiting = document.getElementById("waiting");
        var offline = document.getElementById("offline");
        var copy = document.getElementById("waiting-copy");

        function giveUp() {
          waiting.hidden = true;
          offline.hidden = false;
        }

        function check() {
          tries += 1;

          // `cache: "no-store"` because the answer is about *now*. A cached 200
          // would have this reload into the same dead server for ever.
          fetch("/api/health", { cache: "no-store" })
            .then(function (res) {
              if (!res.ok) throw new Error("not ready");
              // It is answering. Going back to the address bar's own URL rather
              // than to "/" keeps whatever the user actually opened.
              window.location.reload();
            })
            .catch(function () {
              if (tries >= ATTEMPTS) return giveUp();
              // Said only once there is something worth saying: a message that
              // appears instantly reads as an error rather than as a wait.
              if (tries === 3) copy.textContent = "Waiting for your server…";
              window.setTimeout(check, INTERVAL_MS);
            });
        }

        document.getElementById("retry").addEventListener("click", function () {
          tries = 0;
          offline.hidden = true;
          waiting.hidden = false;
          copy.textContent = "Trying again…";
          check();
        });

        // Coming back to the app is itself a reason to look again, and it is a
        // better signal than any timer: a phone that has just been handed its
        // network back fires this before the next tick would have run.
        window.addEventListener("online", function () {
          tries = 0;
          check();
        });

        check();
      })();
    </script>
  </body>
</html>
