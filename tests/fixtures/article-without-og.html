<!doctype html>
<!-- Round 10 review: an article head that names no picture, and an http
     one in the body that must not be taken for it. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A Story With No Picture | Example Reporter</title>
  <meta property="og:title" content="A Story With No Picture">
</head>
<body>
  <meta property="og:image" content="https://cdn.example.com/in-the-body.jpg">
  <p>The article body.</p>
</body>
</html>
